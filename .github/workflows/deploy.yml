name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Build project
        run: npm run build

      # Pinned action commit (v2.2.0) and exact Chrome version, so a CI break is loud, not silent.
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: "148.0.7778.97"
          install-dependencies: true

      # Renders the home page into dist/index.html. Exits non-zero on any failed
      # check, which stops this job, so the deploy job never runs.
      - name: Prerender home page
        run: npm run prerender
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
